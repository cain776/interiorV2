name: interior-v2

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interior
    ports:
      - "5432:5432"
    volumes:
      - interior_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interior"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  interior_pg_data:
