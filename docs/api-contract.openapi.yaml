openapi: 3.1.0
info:
  title: 인테리어 견적 관리 API
  version: 0.2.0
  description: |
    프론트와 백엔드의 단일 진실 공급원. 어떤 코드보다 먼저 수정한다.

    ## 응답 규격
    - **성공**: `{ ok: true, data: T }`
    - **실패**: `{ ok: false, error: string, fieldErrors?: Record<string, string> }`

    ## 인증
    세션 쿠키 기반 (`sid`). `/api/health`, `/api/auth/signup`, `/api/auth/login` 외
    모든 라우트는 로그인 필요. 401 응답 시 클라이언트는 `/login` 으로 리다이렉트.

    ## 변경 절차
    1. 이 문서 먼저 수정
    2. 백엔드 라우트 + repos 구현
    3. 프론트 `api.js` 함수 + 모듈 호출
    4. 양쪽 typecheck 통과 확인

    ## 도메인 노트
    - **견적 채택**: `quotes.status` 와 `line_items.selected_quote_id` 를 의도적으로 분리.
      `POST /api/quotes/{id}/select` 는 line_items.selected_quote_id 만 갱신, status 는 사용자가 수동 관리.
    - **첨부**: 현재 base64 data URL 로 직렬화해 JSON 으로 전송, 5MB 제한.
      추후 `@fastify/multipart` + S3 로 이전 시 별도 라우트 분리.
    - **순서 변경**: phases / spaces / line-items / review-materials 는 별도 reorder 엔드포인트.
      attachments 도 동일.
  contact:
    name: Project repository
    url: https://github.com/your-org/interior-v2
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://localhost:3001
    description: 로컬 개발 서버
  - url: https://interior.example.com
    description: 운영 (예시)

externalDocs:
  description: 아키텍처 문서
  url: ./architecture.md

security:
  - cookieAuth: []

tags:
  - { name: health, description: 서버 상태 }
  - { name: auth, description: 회원가입/로그인/세션 }
  - { name: projects, description: 프로젝트 }
  - { name: vendors, description: 업체 }
  - { name: phases, description: 공정 }
  - { name: spaces, description: 공간 }
  - { name: line-items, description: 견적 항목 }
  - { name: quotes, description: 견적 }
  - { name: contracts, description: 계약 }
  - { name: payments, description: 결제 }
  - { name: change-orders, description: 변경오더 }
  - { name: as-tickets, description: AS }
  - { name: attachments, description: 첨부/사진 }
  - { name: review-materials, description: 검토자료 }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: 세션 쿠키. signup/login 성공 시 발급. health/signup/login 외 모든 라우트는 이 쿠키 필요.

  schemas:
    ApiSuccess:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data: {}
    ApiError:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
    DeleteSuccess:
      description: 삭제 성공 응답. data.id 는 삭제된 리소스 id.
      allOf:
        - $ref: "#/components/schemas/ApiSuccess"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id]
              properties:
                id: { type: string }

    HealthData:
      type: object
      required: [status, time]
      properties:
        status: { type: string, example: up }
        time: { type: string, format: date-time }

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }

    Project:
      type: object
      required: [id, ownerId, name, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        sizeKr: { type: number, nullable: true, description: 평형(평) }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        totalBudget: { type: integer, nullable: true }
        status:
          type: string
          enum: [planning, in_progress, done, archived]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Vendor:
      type: object
      required: [id, ownerId, name, createdAt, updatedAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        ceo: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        specialty: { type: string, nullable: true }
        rating: { type: integer, nullable: true, minimum: 0, maximum: 5 }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Consideration:
      type: object
      required: [id, label, source, checked]
      properties:
        id: { type: string }
        label: { type: string }
        source: { type: string, enum: [template, custom] }
        checked: { type: boolean }
        note: { type: string, nullable: true }
        spaceId: { type: string, nullable: true }
        lineItemId: { type: string, nullable: true }
        priority: { type: string, enum: [normal, important, critical] }

    Phase:
      type: object
      required: [id, projectId, name, sortOrder, status, considerations, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        templateKey: { type: string, nullable: true }
        scheduledStart: { type: string, format: date, nullable: true }
        scheduledEnd: { type: string, format: date, nullable: true }
        status:
          type: string
          enum: [planned, in_progress, done, as]
        sortOrder: { type: integer }
        considerations:
          type: array
          items: { $ref: "#/components/schemas/Consideration" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Space:
      type: object
      required: [id, projectId, name, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        areaSqm: { type: number, nullable: true }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LineItem:
      type: object
      required: [id, phaseId, label, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string }
        phaseId: { type: string }
        spaceId: { type: string, nullable: true }
        locationLabel: { type: string, nullable: true }
        workItemLabel: { type: string, nullable: true }
        label: { type: string }
        memo: { type: string, nullable: true }
        selectedQuoteId: { type: string, nullable: true }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Quote:
      type: object
      required: [id, lineItemId, vendorId, mode, price, status, meta, createdAt, updatedAt]
      properties:
        id: { type: string }
        lineItemId: { type: string }
        vendorId: { type: string }
        mode: { type: string, enum: [turnkey, self] }
        price: { type: integer }
        status: { type: string, enum: [candidate, negotiating, contracted, cancelled] }
        meta:
          type: object
          additionalProperties: true
        memo: { type: string, nullable: true }
        selectedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Contract:
      type: object
      required: [id, projectId, type, status, title, amount, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        phaseId: { type: string, nullable: true }
        vendorId: { type: string, nullable: true }
        parentContractId: { type: string, nullable: true }
        type: { type: string, enum: [standalone, subcontract] }
        status:
          type: string
          enum: [planned, contracted, in_progress, done, disputed, cancelled]
        title: { type: string }
        amount: { type: integer }
        scheduledStart: { type: string, format: date, nullable: true }
        scheduledEnd: { type: string, format: date, nullable: true }
        actualStart: { type: string, format: date, nullable: true }
        actualEnd: { type: string, format: date, nullable: true }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Payment:
      type: object
      required: [id, projectId, kind, status, amount, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        contractId: { type: string, nullable: true }
        kind: { type: string, enum: [deposit, progress, final, extra, refund] }
        status: { type: string, enum: [pending, paid, overdue, cancelled] }
        amount: { type: integer }
        dueDate: { type: string, format: date, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ChangeOrder:
      type: object
      required: [id, projectId, reason, status, title, amountDelta, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        contractId: { type: string, nullable: true }
        reason:
          type: string
          enum: [site_change, additional_request, defect, other]
        status: { type: string, enum: [requested, approved, rejected, cancelled] }
        title: { type: string }
        amountDelta: { type: integer }
        approvedAt: { type: string, format: date-time, nullable: true }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AsTicket:
      type: object
      required: [id, projectId, status, priority, title, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        contractId: { type: string, nullable: true }
        phaseId: { type: string, nullable: true }
        lineItemId: { type: string, nullable: true }
        status: { type: string, enum: [received, confirmed, in_progress, done, on_hold] }
        priority: { type: string, enum: [normal, urgent] }
        title: { type: string }
        content: { type: string, nullable: true }
        occurredAt: { type: string, format: date, nullable: true }
        resolvedAt: { type: string, format: date, nullable: true }
        warrantyExpiresAt: { type: string, format: date, nullable: true }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Attachment:
      type: object
      required: [id, projectId, ownerType, ownerId, kind, filename, blobUrl, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        ownerType:
          type: string
          enum: [project, vendor, phase, space, lineItem, quote, contract, payment, changeOrder, asTicket]
        ownerId: { type: string }
        kind: { type: string, enum: [photo, pdf, drawing, document, other] }
        photoKind:
          type: string
          enum: [before, during, after, reference, defect, floorplan, naver_floorplan, fixture]
          nullable: true
        filename: { type: string }
        contentType: { type: string, nullable: true }
        byteSize: { type: integer, nullable: true }
        blobUrl: { type: string }
        blobPathname: { type: string, nullable: true }
        caption: { type: string, nullable: true }
        takenAt: { type: string, format: date, nullable: true }
        linkUrl: { type: string, nullable: true }
        uploadedById: { type: string, nullable: true }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReviewMaterial:
      type: object
      required: [id, projectId, title, url, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        url: { type: string }
        source: { type: string, nullable: true }
        memo: { type: string, nullable: true }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuditLog:
      description: |
        audit_logs 테이블의 read 모델. 현재는 외부 API 로 노출되지 않으나
        도메인 객체로 단일 진실 공급원 (OpenAPI) 에 정의해 코드/스키마와 동기화 유지.
        actor_user_id 가 NULL 인 행은 미인증 액션 (예: 실패한 login 시도).
        diff 는 행위에 따라 모양이 다른 자유 JSONB 이므로 additionalProperties: true.
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: integer, format: int64, description: BIGSERIAL — 단조 증가 시계열 id }
        actorUserId: { type: string, nullable: true }
        action:
          type: string
          description: '"login.success" / "delete" / "payment.update" 등 점 표기.'
        targetType: { type: string, nullable: true, description: 영향받은 리소스 종류 (project, payment, ...) }
        targetId: { type: string, nullable: true }
        diff:
          type: object
          additionalProperties: true
          nullable: true
          description: before/after 또는 액션별 메타. 행위마다 키가 다름.
        ip: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    WorkspaceBundle:
      type: object
      required: [project, phases, spaces, lineItems, quotes, vendors, contracts, payments, changeOrders, asTickets, attachments, reviewMaterials]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        phases:
          type: array
          items: { $ref: "#/components/schemas/Phase" }
        spaces:
          type: array
          items: { $ref: "#/components/schemas/Space" }
        lineItems:
          type: array
          items: { $ref: "#/components/schemas/LineItem" }
        quotes:
          type: array
          items: { $ref: "#/components/schemas/Quote" }
        vendors:
          type: array
          items: { $ref: "#/components/schemas/Vendor" }
        contracts:
          type: array
          items: { $ref: "#/components/schemas/Contract" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        changeOrders:
          type: array
          items: { $ref: "#/components/schemas/ChangeOrder" }
        asTickets:
          type: array
          items: { $ref: "#/components/schemas/AsTicket" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        reviewMaterials:
          type: array
          items: { $ref: "#/components/schemas/ReviewMaterial" }

  responses:
    Unauthorized:
      description: 로그인 필요
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: 리소스 없음 또는 권한 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: 입력 검증 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

paths:
  /api/health:
    get:
      tags: [health]
      security: []
      summary: 서버 상태 확인
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/HealthData" }

  /api/auth/signup:
    post:
      tags: [auth]
      security: []
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string, minLength: 1 }
      responses:
        "200":
          description: 가입 후 자동 로그인
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/auth/login:
    post:
      tags: [auth]
      security: []
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
            examples:
              normal:
                summary: 정상 로그인
                value: { email: "user@example.com", password: "secret1234" }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: 로그인 실패 (이메일 또는 비밀번호 불일치)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃
      responses:
        "200":
          description: 로그아웃됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok: { type: boolean, enum: [true] }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/me:
    get:
      tags: [auth]
      summary: 현재 로그인 사용자
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/projects:
    get:
      tags: [projects]
      summary: 내 프로젝트 목록
      responses:
        "200":
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Project" }
    post:
      tags: [projects]
      summary: 프로젝트 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                address: { type: string, nullable: true }
                sizeKr: { type: number, nullable: true }
                startDate: { type: string, format: date, nullable: true }
                endDate: { type: string, format: date, nullable: true }
                totalBudget: { type: integer, nullable: true }
                status:
                  type: string
                  enum: [planning, in_progress, done, archived]
            examples:
              minimal:
                summary: 이름만 (다른 값은 추후 보정)
                value: { name: "신축 아파트 35평" }
              full:
                summary: 모든 필드 입력
                value:
                  name: "검암서해그랑블 리모델링"
                  address: "인천 서구 검암동 ..."
                  sizeKr: 33
                  startDate: "2026-04-01"
                  endDate: "2026-06-30"
                  totalBudget: 30000000
                  status: "in_progress"
      responses:
        "200":
          description: 생성된 프로젝트
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Project" }

  /api/projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [projects]
      summary: 프로젝트 단건
      responses:
        "200":
          description: 프로젝트
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Project" }
    patch:
      tags: [projects]
      summary: 프로젝트 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                address: { type: string, nullable: true }
                sizeKr: { type: number, nullable: true }
                startDate: { type: string, format: date, nullable: true }
                endDate: { type: string, format: date, nullable: true }
                totalBudget: { type: integer, nullable: true }
                status:
                  type: string
                  enum: [planning, in_progress, done, archived]
      responses:
        "200":
          description: 수정된 프로젝트
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Project" }
    delete:
      tags: [projects]
      summary: 프로젝트 삭제
      responses:
        "200":
          description: 삭제됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{id}/workspace:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
